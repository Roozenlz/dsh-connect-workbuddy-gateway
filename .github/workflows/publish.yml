# 发布到 npm —— OIDC Trusted Publishing（不存任何长期 token）。
#
# 为什么用 OIDC：
#   npm 已宣布「绕过 2FA 的 token」将在 2027 年 1 月起不能用于直接发布。
#   长期 NPM_TOKEN 迟早失效，而且它一旦泄漏就等于把发布权交出去。
#   Trusted Publishing 让 GitHub Actions 用一次性的 OIDC 身份直接与 npm 换
#   短期凭据：没有密钥可泄漏，也不会过期。
#
# 前置条件（只需配一次，见 README 的「首次发布」）：
#   在 https://www.npmjs.com/package/dsh-workbuddy-gateway/access 配置
#   Trusted Publisher：
#     Publisher:        GitHub Actions
#     Organization:     Roozenlz
#     Repository:       dsh-workbuddy-gateway
#     Workflow name:    publish.yml
#     Environment:      （留空，或与本文件的 environment 保持一致）
#
# 触发条件（任一）：
#   - 推送形如 v1.0.0 的 tag       → 发布该 tag
#   - 在 GitHub 上点 "Run workflow" → 手动发布当前默认分支

name: Publish to npm

on:
  push:
    tags:
      # 只认 v1.0.0 这种形式；分支推送不触发发布。
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不发布（dry run）'
        required: false
        default: false
        type: boolean

# 同一时间只允许一个发布，避免重复上传同一个版本。
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # OIDC 换发行凭据必需。少了它 npm 会说找不到 trusted publisher 的凭据。
      id-token: write
      # 读仓库内容（checkout 需要）。
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要 npm >= 11.5.1；Node 22 自带的是 npm 10。
      # 这一步不能省，否则 publish 会退回去找 NODE_AUTH_TOKEN 然后失败。
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      # 这个包没有运行时依赖，也没有构建步骤 —— 源码就是发布物。
      # 仍跑一次自测：发布一个连自己测试都过不了的版本没有意义。
      - name: Run tests
        run: node tests/harness.mjs

      # tag 名与 package.json 的 version 必须一致。
      # 不一致时发出去的版本号会与 tag 对不上，回滚和排查都会混乱。
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Show what will be published
        run: npm pack --dry-run

      # 不设 NODE_AUTH_TOKEN：凭据由 OIDC 换取，provenance 由 npm 自动附带。
      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public

      - name: Dry run only
        if: inputs.dry_run == true
        run: echo "dry_run was set; skipped publishing."
